<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="The crew you build: your topic goes to a Lead Researcher who writes a plan; three researchers work on one sub-question each at the same time; a Report Writer combines their findings into the report">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.18"/></filter>
  </defs>
  <rect width="860" height="330" rx="16" fill="#fcfcfb"/>
  <text x="430" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#0b0b0b">Your deep research crew</text>
  <text x="430" y="58" text-anchor="middle" font-size="13" fill="#52514e">5 agents · 5 tasks · 1 crew</text>

  <!-- topic -->
  <rect x="20" y="148" width="104" height="46" rx="23" fill="#ffffff" stroke="#b9b8b2" filter="url(#s)"/>
  <text x="72" y="168" text-anchor="middle" font-size="13" fill="#0b0b0b">❓ your</text>
  <text x="72" y="185" text-anchor="middle" font-size="13" fill="#0b0b0b">topic</text>
  <line x1="124" y1="171" x2="148" y2="171" stroke="#52514e" stroke-width="2" marker-end="url(#a)"/>

  <!-- lead -->
  <g filter="url(#s)">
    <rect x="152" y="118" width="140" height="106" rx="12" fill="#2a78d6"/>
  </g>
  <circle cx="222" cy="146" r="18" fill="#ffffff"/><text x="222" y="153" text-anchor="middle" font-size="19">🧭</text>
  <text x="222" y="184" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Lead Researcher</text>
  <text x="222" y="204" text-anchor="middle" font-size="12" fill="#fff" font-family="ui-monospace, Menlo, Consolas, monospace">plan</text>
  <text x="222" y="244" text-anchor="middle" font-size="12" fill="#52514e">splits it into</text>
  <text x="222" y="260" text-anchor="middle" font-size="12" fill="#52514e">3 sub-questions</text>

  <!-- fan out -->
  <path d="M292 160 C 330 160, 330 98, 368 98" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="292" y1="171" x2="366" y2="171" stroke="#52514e" stroke-width="2" marker-end="url(#a)"/>
  <path d="M292 182 C 330 182, 330 244, 368 244" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#a)"/>
  <text x="282" y="292" text-anchor="middle" font-size="11.5" fill="#52514e" font-family="ui-monospace, Menlo, Consolas, monospace">context=[plan]</text>

  <!-- researchers -->
  <rect x="356" y="68" width="200" height="214" rx="14" fill="#fdf0ea" stroke="#eb6834" stroke-dasharray="6 5"/>
  <g filter="url(#s)">
    <rect x="372" y="76" width="168" height="44" rx="10" fill="#eb6834"/>
    <rect x="372" y="149" width="168" height="44" rx="10" fill="#eb6834"/>
    <rect x="372" y="222" width="168" height="44" rx="10" fill="#eb6834"/>
  </g>
  <g font-size="14" font-weight="700" fill="#fff">
    <text x="392" y="104">🔎</text><text x="420" y="104">Researcher 1</text>
    <text x="392" y="177">🔎</text><text x="420" y="177">Researcher 2</text>
    <text x="392" y="250">🔎</text><text x="420" y="250">Researcher 3</text>
  </g>
  <text x="456" y="306" text-anchor="middle" font-size="13" font-weight="700" fill="#b54a1f">⚡ one sub-question each, all at once</text>
  <text x="456" y="322" text-anchor="middle" font-size="11.5" fill="#52514e" font-family="ui-monospace, Menlo, Consolas, monospace">async_execution=True</text>

  <!-- fan in -->
  <path d="M540 98 C 580 98, 580 160, 618 160" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="540" y1="171" x2="616" y2="171" stroke="#52514e" stroke-width="2" marker-end="url(#a)"/>
  <path d="M540 244 C 580 244, 580 182, 618 182" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#a)"/>
  <text x="606" y="292" text-anchor="middle" font-size="11.5" fill="#52514e" font-family="ui-monospace, Menlo, Consolas, monospace">context=research</text>

  <!-- writer -->
  <g filter="url(#s)">
    <rect x="622" y="118" width="128" height="106" rx="12" fill="#1baf7a"/>
  </g>
  <circle cx="686" cy="146" r="18" fill="#ffffff"/><text x="686" y="153" text-anchor="middle" font-size="19">✍️</text>
  <text x="686" y="184" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Report Writer</text>
  <text x="686" y="204" text-anchor="middle" font-size="12" fill="#fff" font-family="ui-monospace, Menlo, Consolas, monospace">report</text>
  <text x="686" y="244" text-anchor="middle" font-size="12" fill="#52514e">waits for all 3,</text>
  <text x="686" y="260" text-anchor="middle" font-size="12" fill="#52514e">then combines</text>
  <line x1="750" y1="171" x2="774" y2="171" stroke="#52514e" stroke-width="2" marker-end="url(#a)"/>

  <!-- report doc -->
  <g filter="url(#s)">
    <path d="M778 128 h56 l14 14 v82 h-70 z" fill="#ffffff" stroke="#b9b8b2"/>
  </g>
  <path d="M834 128 v14 h14" fill="none" stroke="#b9b8b2"/>
  <rect x="788" y="150" width="44" height="6" rx="2" fill="#0b0b0b"/>
  <rect x="788" y="164" width="50" height="4" rx="2" fill="#b9b8b2"/>
  <rect x="788" y="174" width="46" height="4" rx="2" fill="#b9b8b2"/>
  <rect x="788" y="188" width="30" height="5" rx="2" fill="#1baf7a"/>
  <rect x="788" y="200" width="50" height="4" rx="2" fill="#b9b8b2"/>
  <rect x="788" y="210" width="40" height="4" rx="2" fill="#b9b8b2"/>
  <text x="813" y="244" text-anchor="middle" font-size="12" fill="#52514e">your report</text>
</svg>
