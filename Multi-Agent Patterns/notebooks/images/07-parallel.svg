<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Timeline: with async_execution=True the three researchers run at the same time and the report is ready sooner; with async_execution=False they run one after another and the run takes much longer">
  <rect width="860" height="330" rx="16" fill="#fcfcfb"/>
  <text x="430" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0b0b0b">Same work, less waiting</text>

  <!-- grid -->
  <g stroke="#e4e3de">
    <line x1="170" y1="56" x2="170" y2="300"/><line x1="290" y1="56" x2="290" y2="300"/><line x1="410" y1="56" x2="410" y2="300"/>
    <line x1="530" y1="56" x2="530" y2="300"/><line x1="650" y1="56" x2="650" y2="300"/><line x1="770" y1="56" x2="770" y2="300"/>
  </g>
  <text x="840" y="318" text-anchor="end" font-size="11.5" fill="#52514e">time →</text>

  <!-- parallel -->
  <text x="30" y="70" font-size="14" font-weight="700" fill="#0b0b0b">⚡ In parallel</text>
  <text x="30" y="88" font-size="11.5" fill="#52514e" font-family="ui-monospace, Menlo, Consolas, monospace">async_execution=True</text>
  <g font-size="12" fill="#52514e" text-anchor="end">
    <text x="160" y="110">Lead</text><text x="160" y="128">Researcher 1</text><text x="160" y="146">Researcher 2</text><text x="160" y="164">Researcher 3</text><text x="160" y="182">Writer</text>
  </g>
  <rect x="170" y="100" width="70" height="13" rx="4" fill="#2a78d6"/>
  <rect x="242" y="118" width="120" height="13" rx="4" fill="#eb6834"/>
  <rect x="242" y="136" width="110" height="13" rx="4" fill="#eb6834"/>
  <rect x="242" y="154" width="126" height="13" rx="4" fill="#eb6834"/>
  <rect x="370" y="172" width="80" height="13" rx="4" fill="#1baf7a"/>
  <text x="460" y="183" font-size="13" font-weight="700" fill="#0b0b0b">✅ done</text>

  <line x1="30" y1="204" x2="830" y2="204" stroke="#e4e3de" stroke-width="2"/>

  <!-- sequential -->
  <text x="30" y="226" font-size="14" font-weight="700" fill="#0b0b0b">🐢 One after another</text>
  <text x="30" y="244" font-size="11.5" fill="#52514e" font-family="ui-monospace, Menlo, Consolas, monospace">async_execution=False</text>
  <g font-size="12" fill="#52514e" text-anchor="end">
    <text x="160" y="266">Lead</text><text x="160" y="284">Researchers</text><text x="160" y="302">Writer</text>
  </g>
  <rect x="170" y="256" width="70" height="13" rx="4" fill="#2a78d6"/>
  <rect x="242" y="274" width="120" height="13" rx="4" fill="#eb6834"/>
  <rect x="364" y="274" width="110" height="13" rx="4" fill="#eb6834"/>
  <rect x="476" y="274" width="126" height="13" rx="4" fill="#eb6834"/>
  <g font-size="10.5" fill="#fff" font-weight="700" text-anchor="middle">
    <text x="302" y="284">1</text><text x="419" y="284">2</text><text x="539" y="284">3</text>
  </g>
  <rect x="604" y="292" width="80" height="13" rx="4" fill="#1baf7a"/>
  <text x="694" y="303" font-size="13" font-weight="700" fill="#0b0b0b">✅ done</text>
  <path d="M452 180 L 452 196" stroke="none"/>
  <text x="560" y="140" font-size="13" fill="#0b0b0b">Same tokens, same answer quality.</text>
  <text x="560" y="160" font-size="13" fill="#0b0b0b">Only the waiting changes.</text>
</svg>
